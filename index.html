<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidco AI - Free Professional AI Video Generator</title>
<meta name="description" content="Vidco AI is free professional text to video generator. No watermark, no text on video, 4K quality. Made in Pakistan.">
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');body{font-family:'Space Grotesk',sans-serif;background:#09090b}</style>
</head>
<body class="text-white">
<div class="max-w-6xl mx-auto p-6">
<div class="flex justify-between"><h1 class="text-2xl font-bold text-violet-400">VIDCO AI</h1><span class="bg-zinc-800 px-3 py-1 rounded-full text-xs">PRO • NO TEXT ON VIDEO</span></div>
<h2 class="text-center text-5xl font-bold mt-12">Text to <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-500 to-pink-500">Viral Video</span></h2>
<p class="text-center text-zinc-400 mt-3">Professional • No Watermark • No Text Overlay</p>

<div class="grid md:grid-cols-2 gap-6 mt-10 bg-zinc-900 border border-zinc-800 rounded-[24px] p-6">
<div>
<textarea id="prompt" placeholder="Ex: A Pakistani girl in village, using smartphone, cinematic 4k" class="w-full h-32 bg-black border border-zinc-800 rounded-xl p-4 outline-none focus:border-violet-500"></textarea>
<select id="style" class="w-full mt-4 bg-black border border-zinc-800 rounded-xl p-3"><option>Cinematic Epic</option><option>Realistic 4K</option><option>3D Pixar</option><option>Horror</option><option>Islamic</option></select>
<button id="btn" class="w-full mt-5 bg-gradient-to-r from-violet-600 to-pink-600 rounded-full py-4 font-bold">⚡ GENERATE VIDEO</button>
<p id="status" class="text-center text-xs text-zinc-500 mt-2">Ready • Professional Output</p>
</div>
<div class="bg-black rounded-2xl border border-zinc-800 min-h-[350px] flex items-center justify-center relative overflow-hidden">
<video id="video" controls class="w-full h-full hidden rounded-2xl"></video>
<div id="ph" class="text-center"><div class="text-5xl">🎬</div><p class="text-zinc-500 text-sm mt-2">Video yahan ayegi<br>Bina kisi text ke</p></div>
<div id="load" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center"><div class="w-8 h-8 border-4 border-violet-500 border-t-transparent rounded-full animate-spin"></div><p class="mt-3 text-sm">Generating...</p></div>
</div>
</div>
</div>

<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.js";
const btn=document.getElementById('btn'), st=document.getElementById('status'), vid=document.getElementById('video'), load=document.getElementById('load'), ph=document.getElementById('ph');
btn.onclick=async()=>{
 const p=document.getElementById('prompt').value; const s=document.getElementById('style').value;
 if(!p) return alert('Prompt likho bhai!');
 load.classList.remove('hidden'); st.innerText='⏳ 40 sec wait - Professional video ban rahi hai...'; btn.disabled=true;
 try{
  const client=await Client.connect("Vidcoai/vidco-ai");
  const res=await client.predict("/predict",{prompt:p, style:s, duration:4});
  let url=res.data[0].video?res.data[0].video.url:res.data[0];
  vid.src=url; vid.classList.remove('hidden'); ph.classList.add('hidden'); st.innerText='✅ Ready - No Text Overlay!';
 }catch(e){ st.innerText='❌ Space sleep me hai, 1 min baad try karo'; window.open('https://huggingface.co/spaces/Vidcoai/vidco-ai','_blank'); }
 finally{ load.classList.add('hidden'); btn.disabled=false; }
}
</script>
</body>
</html>
