<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidco AI - Full Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#08080a] text-white">
<!-- HEADER -->
<div class="flex justify-between items-center p-4 border-b border-zinc-800 max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold">VIDCO <span class="text-violet-500">AI</span> <span class="text-[10px] bg-violet-600 px-2 py-1 rounded ml-2">PRO STUDIO</span></h1>
  <div class="flex gap-2">
    <button onclick="alert('Sign In - Coming Soon! Local storage me save hoga')" class="px-5 py-2 rounded-full border border-zinc-700 text-sm">Sign In</button>
    <button onclick="alert('Sign Up Free!')" class="px-5 py-2 rounded-full bg-white text-black text-sm font-bold">Sign Up</button>
  </div>
</div>

<div class="max-w-7xl mx-auto grid lg:grid-cols-3 gap-6 p-4">
  <!-- LEFT CONTROLS -->
  <div class="lg:col-span-2 bg-[#121214] border border-zinc-800 rounded-[24px] p-5 space-y-5">

    <div>
      <label class="text-xs text-zinc-400 flex gap-2"><i class="fa fa-pen"></i> PROMPT BOX</label>
      <textarea id="prompt" class="w-full mt-2 bg-black border border-zinc-800 rounded-xl p-3 text-sm h-24 outline-none focus:border-violet-500" placeholder="Example: A Pakistani news anchor talking, serious face..."></textarea>
    </div>

    <div>
      <label class="text-xs text-zinc-400"><i class="fa fa-user"></i> AVATAR BOX - Select Character</label>
      <div class="grid grid-cols-4 gap-2 mt-2">
        <div onclick="selectAvatar(this)" class="avatar border-2 border-violet-500 rounded-xl overflow-hidden cursor-pointer"><img src="https://i.pravatar.cc/100?img=5"><p class="text-[10px] text-center py-1">Girl 1</p></div>
        <div onclick="selectAvatar(this)" class="avatar border border-zinc-700 rounded-xl overflow-hidden cursor-pointer"><img src="https://i.pravatar.cc/100?img=8"><p class="text-[10px] text-center py-1">Boy 1</p></div>
        <div onclick="selectAvatar(this)" class="avatar border border-zinc-700 rounded-xl overflow-hidden cursor-pointer"><img src="https://i.pravatar.cc/100?img=32"><p class="text-[10px] text-center py-1">Maulana</p></div>
        <div onclick="selectAvatar(this)" class="avatar border border-zinc-700 rounded-xl overflow-hidden cursor-pointer"><img src="https://i.pravatar.cc/100?img=12"><p class="text-[10px] text-center py-1">Horror</p></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-xs text-zinc-400"><i class="fa fa-expand"></i> RATIO BOX</label>
        <select id="ratio" class="w-full mt-2 bg-black border border-zinc-800 rounded-xl p-3 text-sm"><option>9:16 - TikTok / Reels</option><option>16:9 - YouTube</option><option>1:1 - Instagram</option></select>
      </div>
      <div>
        <label class="text-xs text-zinc-400"><i class="fa fa-palette"></i> STYLE BOX</label>
        <select id="style" class="w-full mt-2 bg-black border border-zinc-800 rounded-xl p-3 text-sm"><option>Realistic 4K</option><option>Cinematic Epic</option><option>3D Pixar Cartoon</option><option>Anime</option><option>Horror Dark</option><option>Islamic</option></select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-xs text-zinc-400"><i class="fa fa-microphone"></i> VOICE OVER BOX</label>
        <select id="voice" class="w-full mt-2 bg-black border border-zinc-800 rounded-xl p-3 text-sm"><option>Urdu Male - Deep</option><option>Urdu Female - Soft</option><option>English Male</option><option>English Female</option><option>No Voice</option></select>
      </div>
      <div>
        <label class="text-xs text-zinc-400"><i class="fa fa-image"></i> APNI PICTURE SE VIDEO</label>
        <input type="file" id="imgUpload" accept="image/*" class="w-full mt-2 bg-black border border-zinc-800 rounded-xl p-2 text-xs">
      </div>
    </div>

    <button id="btn" class="w-full bg-gradient-to-r from-violet-600 to-pink-600 rounded-full py-4 font-bold">⚡ GENERATE PRO VIDEO</button>
    <p id="status" class="text-center text-xs text-zinc-500">Professional • No Text On Video • Ready</p>
  </div>

  <!-- RIGHT PREVIEW -->
  <div class="bg-[#121214] border border-zinc-800 rounded-[24px] p-4">
    <h3 class="text-sm font-bold mb-3">PREVIEW</h3>
    <div class="bg-black rounded-2xl min-h-[500px] flex items-center justify-center relative border border-zinc-800 overflow-hidden">
      <video id="video" controls autoplay loop class="hidden w-full h-full object-cover rounded-2xl"></video>
      <div id="ph" class="text-center"><div class="text-4xl">🎬</div><p class="text-xs text-zinc-500 mt-2">Video Preview<br>Yahan ayegi</p></div>
      <div id="ld" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center"><div class="w-8 h-8 border-2 border-violet-500 border-t-transparent rounded-full animate-spin"></div><p class="text-xs mt-2">AI Generating...</p></div>
    </div>
    <div class="mt-4 grid grid-cols-3 gap-2 text-[10px] text-zinc-400 text-center">
      <div class="bg-black rounded-lg p-2">✅ No Watermark</div><div class="bg-black rounded-lg p-2">✅ No Text</div><div class="bg-black rounded-lg p-2">✅ 4K HD</div>
    </div>
  </div>
</div>

<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@1.7.0/dist/index.js";
function selectAvatar(el){ document.querySelectorAll('.avatar').forEach(a=>a.classList.remove('border-violet-500','border-2')); document.querySelectorAll('.avatar').forEach(a=>a.classList.add('border-zinc-700')); el.classList.remove('border-zinc-700'); el.classList.add('border-2','border-violet-500'); }
window.selectAvatar=selectAvatar;
const btn=document.getElementById('btn');
btn.onclick=async()=>{
  const prompt=document.getElementById('prompt').value; const style=document.getElementById('style').value;
  if(!prompt) return alert('Prompt likho bhai!');
  document.getElementById('ld').classList.remove('hidden');
  try{
    const client=await Client.connect("Vidcoai/vidco-ai");
    const res=await client.predict("/predict",{prompt: prompt + " " + style, style: style, duration: 4});
    let url=res.data[0].video?res.data[0].video.url:res.data[0];
    if(typeof url!='string') url=res.data[0][0]?.video?.url || res.data[0].url;
    const v=document.getElementById('video'); v.src=url; v.classList.remove('hidden'); document.getElementById('ph').classList.add('hidden');
    document.getElementById('status').innerText='✅ Video Ready - Professional!';
  }catch(e){ document.getElementById('status').innerText='Space waking up, 20 sec baad try karo'; }
  finally{ document.getElementById('ld').classList.add('hidden'); }
}
</script>
</body>
</html>
